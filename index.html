<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mytacks Watch-to-Earn</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: Arial, sans-serif; background-color: #1a1a1a; color: white; text-align: center; padding: 20px; }
        .card { background: #2a2a2a; border-radius: 12px; padding: 20px; margin-bottom: 20px; box-shadow: 0 4px 8px rgba(0,0,0,0.3); }
        .balance { font-size: 28px; color: #ffd700; font-weight: bold; }
        .btn { background: #0088cc; color: white; border: none; padding: 15px 30px; font-size: 18px; border-radius: 8px; cursor: pointer; width: 100%; margin-top: 10px; }
        .btn:disabled { background: #555; }
    </style>
</head>
<body>

    <h2>Mytacks Official Bot</h2>
    
    <div class="card">
        <p>Your Total Balance:</p>
        <div class="balance" id="balance">$0.00</div>
    </div>

    <div class="card">
        <h3>Watch Ads & Earn</h3>
        <p>Watch a short video ad to earn **$0.005** instantly!</p>
        <button class="btn" onclick="watchAd()">Watch Ad</button>
    </div>

    <script>
        let balance = 0.00;

        function watchAd() {
            // Ad SDK Integration spot
            alert("Loading Ad... You will receive $0.005 reward upon completion.");
            
            // Simulating Reward
            balance += 0.005;
            document.getElementById('balance').innerText = '$' + balance.toFixed(3);
        }
    </script>
</body>
</html>
